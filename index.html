<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GlobalFlows" />
  <!--
    iOS full-bleed (from BubblinCrude): PWA uses fillH. Safari tab shell inset 0.
    Do not use max-height:100dvh on PWA.
  -->
  <script>
    (function () {
      try {
        var host = location.hostname || "";
        var local =
          host === "localhost" ||
          host === "127.0.0.1" ||
          /^192\.168\./.test(host) ||
          /^10\./.test(host) ||
          /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
        if (local && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
        }
        var r = document.documentElement;
        var n = window.navigator;
        var standalone =
          n.standalone === true ||
          (window.matchMedia &&
            (window.matchMedia("(display-mode: standalone)").matches ||
              window.matchMedia("(display-mode: fullscreen)").matches));
        var iw = window.innerWidth || 0;
        var ih = window.innerHeight || 0;
        var sw = (window.screen && window.screen.width) || 0;
        var sh = (window.screen && window.screen.height) || 0;
        var screenMax = Math.max(sw, sh);
        var screenMin = Math.min(sw, sh);
        if (standalone) {
          r.classList.add("pwa-standalone");
          var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
          var extra = 0;
          if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) extra = 20;
          var total = fillH + extra;
          r.style.setProperty("--pwa-fill-h", fillH + "px");
          r.style.setProperty("--pwa-extra-b", extra + "px");
          r.style.height = total + "px";
          r.style.minHeight = total + "px";
        }
      } catch (e) {}
    })();
  </script>
  <meta
    name="description"
    content="Global macro causal picture — liquidity, rates & dollar, growth & inflation, risk."
  />
  <title>GlobalFlows — global money machine in motion</title>
  <meta property="og:title" content="GlobalFlows" />
  <meta
    property="og:description"
    content="Global macro causal picture — liquidity, rates & dollar, growth & inflation, risk."
  />
  <meta property="og:image" content="/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=8" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=8" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" role="banner">
      <div class="topbar-title">
        <h1 class="brand-title">GlobalFlows</h1>
        <span class="build-badge" id="buildBadge" title="Build">8</span>
      </div>
    </header>

    <div class="dials-toolbar">
      <div
        class="dur-group regime-horizon"
        id="horizonGroup"
        title="Today vs this many years — lights, table, and charts"
        aria-label="Comparison horizon"
      >
        <button type="button" class="btn tiny-btn" data-horizon="1">1y</button>
        <button type="button" class="btn tiny-btn" data-horizon="2" aria-pressed="true">2y</button>
        <button type="button" class="btn tiny-btn" data-horizon="5">5y</button>
      </div>
      <nav class="topbar-nav" aria-label="Primary">
        <a
          href="https://oilprice.com/oil-price-charts/#prices"
          class="nav-link nav-link-icon"
          target="_blank"
          rel="noopener noreferrer"
          title="Oil price charts (oilprice.com)"
          aria-label="Oil price charts on oilprice.com"
        ><img src="oilprice-32.png?v=8" width="16" height="16" alt="" /></a>
        <a
          href="https://bubblincrude.markmaga.com"
          class="nav-link nav-link-icon"
          target="_blank"
          rel="noopener noreferrer"
          title="BubblinCrude"
          aria-label="BubblinCrude"
        ><img src="bubblincrude-32.png?v=8" srcset="bubblincrude-64.png?v=8 2x" width="16" height="16" alt="" /></a>
        <a class="nav-link nav-link-sm" href="./about.html">About</a>
      </nav>
    </div>

    <button
      type="button"
      class="regime-today"
      id="regimeToday"
      hidden
      title="Tap for today’s confirming breakdown"
    ></button>

    <div class="pin-anchor" id="pinAnchor" aria-hidden="true"></div>
    <div class="pin-stack" id="pinStack">
      <section class="lights" id="lights" aria-label="Regime lights"></section>
      <nav class="layer-tabs" id="tabs" aria-label="Layers"></nav>
      <div class="heatmap-head">
        <div class="heatmap-titles">
          <h2 id="layerTitle">Series</h2>
          <button
            type="button"
            class="street-hint"
            id="streetHint"
            hidden
            title="Who voted this light"
          >Tap for who voted</button>
          <span class="title-live" id="marketsLive" hidden>
            <span
              class="title-age"
              id="marketsAge"
              title="Last print. Listed names can lag ~15m."
            ></span>
            <button
              type="button"
              class="btn-refresh"
              id="btnMarketsLive"
              title="Pull last prints"
              aria-label="Refresh Markets last prints"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 12a9 9 0 1 1-3.2-6.9"
                />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 3v6h-6"
                />
              </svg>
            </button>
          </span>
        </div>
        <div class="heat-controls" role="toolbar" aria-label="Series view">
          <div class="ctrl-group" id="compareSaveGroup" hidden aria-label="Saved clubs">
            <button type="button" class="btn tiny-btn" id="btnCompare_m1" hidden aria-pressed="false" title="Open m1">m1</button>
            <button type="button" class="btn tiny-btn" id="btnCompare_m2" hidden aria-pressed="false" title="Open m2">m2</button>
            <button type="button" class="btn tiny-btn" id="btnCompare_m3" hidden aria-pressed="false" title="Open m3">m3</button>
          </div>
          <div class="ctrl-group" id="compareClubGroup" hidden aria-label="Club actions">
            <button type="button" class="btn tiny-btn" id="btnCompareSave" hidden aria-pressed="false" title="Save this club">m</button>
            <button type="button" class="btn tiny-btn danger" id="btnCompareDelete" hidden title="Delete this saved club">Delete</button>
          </div>
          <button type="button" class="btn tiny-btn" id="btnCompare" aria-pressed="false" title="Pick up to 10 series, then Go">Compare</button>
          <button type="button" class="btn tiny-btn" id="btnViewMode" aria-pressed="false">Chart</button>
        </div>
      </div>
      <div class="heat-colhead" id="heatColhead" aria-hidden="true">
        <span>Name</span><span>Latest</span><span>2y z</span><span>2y %ile</span>
      </div>
      <div class="market-buckets" id="marketBuckets" hidden></div>
    </div>

    <main class="main">
      <section class="heatmap-wrap">
        <div class="table-scroll">
          <table class="heat" id="heat">
            <thead>
              <tr>
                <th>Series</th>
                <th>Latest</th>
                <th>2y z</th>
                <th>2y <span class="th-abbr">%ile</span><span class="th-full">percentile</span></th>
              </tr>
            </thead>
            <tbody id="heatBody"></tbody>
          </table>
        </div>
      </section>
    </main>

  </div>

  <dialog id="dlgSentence" class="dlg dlg-tap dlg-topsheet">
    <form method="dialog">
      <h3>Today’s regime</h3>
      <div id="sentenceBody" class="dlg-body"></div>
      <div class="dlg-actions">
        <button type="submit" class="btn" value="ok">Close</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgSeries" class="dlg dlg-tap">
    <form method="dialog">
      <h3 id="seriesTitle">Name</h3>
      <div id="seriesBody" class="dlg-body"></div>
      <button class="btn" value="ok">Close</button>
    </form>
  </dialog>

  <dialog id="dlgLight" class="dlg dlg-tap">
    <form method="dialog" id="formLight">
      <h3 id="lightTitle">Light</h3>
      <div id="lightBody" class="dlg-body"></div>
      <div class="dlg-actions">
        <button type="submit" class="btn" value="ok">Close</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=8"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
